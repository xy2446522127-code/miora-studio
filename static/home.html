<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/static/images/huahai-logo.png" type="image/png">
    <title>花海画布 · 首页</title>
    <script>
        (function(){
            try {
                var theme = localStorage.getItem('studio_theme') || localStorage.getItem('canvas_theme') || 'dark';
                document.documentElement.classList.add(theme === 'dark' ? 'theme-dark' : 'theme-light');
                document.documentElement.classList.add(theme === 'dark' ? 'studio-theme-dark' : 'studio-theme-light');
            } catch(e) {}
        })();
    </script>
    <script src="/static/vendor/js/lucide.js"></script>
    <script src="/static/js/theme.js"></script>
    <link rel="stylesheet" href="/static/css/huahai.css">
    <link rel="stylesheet" href="/static/css/huahai-product.css">
</head>
<body data-huaha-page="home" class="huahai-product-page">
    <main class="hh-home">
        <header class="hh-home-header">
            <div>
                <h1>花海画布</h1>
                <p>让灵感像潮汐一样自然流动</p>
            </div>
            <div class="hh-home-status">
                <span id="serviceState" class="hh-service-pill" role="status">
                    <i aria-hidden="true"></i>
                    <b>正在连接服务</b>
                </span>
                <span id="versionState" class="hh-version-pill">v—</span>
            </div>
        </header>

        <section class="hh-home-hero" aria-label="创作启动台">
            <article class="hh-glass hh-create-station">
                <h2>今天想创作什么？</h2>
                <div class="hh-prompt-shell">
                    <textarea id="homePrompt" maxlength="1000" placeholder="描述你想创作的画面…"></textarea>
                    <span id="homePromptCount">0 / 1000</span>
                </div>
                <div class="hh-create-actions">
                    <div class="hh-mode-chip" aria-label="画布模式">
                        <i data-lucide="git-branch"></i>
                        <span>智能画布</span>
                    </div>
                    <button id="continueCanvasBtn" class="hh-btn hh-btn-secondary" type="button">
                        <i data-lucide="history"></i>
                        <span>继续上次画布</span>
                    </button>
                    <button id="startCreateBtn" class="hh-btn hh-btn-primary" type="button">
                        <span>开始创作</span>
                        <i data-lucide="arrow-right"></i>
                    </button>
                </div>
            </article>

            <article id="lastCanvasCard" class="hh-glass hh-last-canvas" aria-label="最近画布">
                <h2>最近画布</h2>
                <button id="lastCanvasButton" class="hh-last-preview" type="button" disabled>
                    <img src="/static/images/huahai-home-preview.png" alt="最近画布预览">
                    <span>
                        <b id="lastCanvasTitle">尚无画布</b>
                        <small id="lastCanvasTime">创建第一块智能画布</small>
                    </span>
                </button>
            </article>
        </section>

        <section class="hh-home-recent" aria-labelledby="recentTitle">
            <div class="hh-section-head">
                <h2 id="recentTitle">最近项目</h2>
                <button id="openProjectsBtn" class="hh-link-btn" type="button">
                    查看全部
                    <i data-lucide="arrow-right"></i>
                </button>
            </div>
            <div id="recentCanvases" class="hh-recent-grid">
                <div class="hh-home-empty">正在读取最近画布…</div>
            </div>
        </section>
    </main>
    <script src="/static/js/huahai-interactions.js"></script>
    <script src="/static/js/home.js"></script>
</body>
</html>
