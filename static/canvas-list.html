<!DOCTYPE html>
<html lang="zh-CN" data-studio-scale="off">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/static/images/huahai-logo.png" type="image/png">
    <title>花海画布 · 项目管理</title>
    <script>
        (function(){
            try {
                var theme = localStorage.getItem('studio_theme') || localStorage.getItem('canvas_theme') || 'dark';
                document.documentElement.classList.add(theme === 'dark' ? 'theme-dark' : 'theme-light');
                document.documentElement.classList.add(theme === 'dark' ? 'studio-theme-dark' : 'studio-theme-light');
            } catch(e) {}
        })();
    </script>
    <script src="/static/vendor/js/lucide.js"></script>
    <script src="/static/js/theme.js"></script>
    <script src="/static/js/i18n.js"></script>
    <link rel="stylesheet" href="/static/css/huahai.css">
    <link rel="stylesheet" href="/static/css/huahai-product.css">
</head>
<body data-huaha-page="canvas-list" class="huahai-product-page">
    <div class="hh-projects">
        <aside class="hh-project-sidebar">
            <div class="hh-project-brand">
                <img src="/static/images/huahai-logo.png" alt="花海">
            </div>
            <div class="hh-project-side-title">
                <strong>项目管理</strong>
                <button id="newProjectBtn" type="button" title="新建项目" aria-label="新建项目">
                    <i data-lucide="plus"></i>
                </button>
            </div>
            <form id="newProjectForm" class="hh-new-project" hidden>
                <input id="newProjectInput" maxlength="60" placeholder="项目名称" autocomplete="off">
                <button type="submit" title="保存"><i data-lucide="check"></i></button>
                <button id="newProjectCancel" type="button" title="取消"><i data-lucide="x"></i></button>
            </form>
            <nav id="projectList" class="hh-project-list" aria-label="项目列表"></nav>
            <button id="trashEntry" class="hh-trash-entry" type="button">
                <i data-lucide="trash-2"></i>
                <span>回收站</span>
                <b id="trashBadge">0</b>
            </button>
        </aside>

        <main class="hh-project-main">
            <header class="hh-project-topbar">
                <div>
                    <h1 id="boardProjectName">默认项目</h1>
                    <span id="boardCanvasCount">0</span>
                </div>
                <div class="hh-project-actions">
                    <span class="hh-order-lock" title="画布不可拖动">
                        <i data-lucide="arrow-up-down"></i>
                        更新时间：新 → 旧
                        <i data-lucide="lock"></i>
                    </span>
                    <button id="boardResetViewBtn" class="hh-square-btn" type="button" title="回到第一张画布">
                        <i data-lucide="locate-fixed"></i>
                    </button>
                    <button id="boardRefresh" class="hh-square-btn" type="button" title="刷新">
                        <i data-lucide="refresh-cw"></i>
                    </button>
                    <button id="newCanvasBtn" class="hh-new-canvas-btn" type="button">
                        <i data-lucide="plus"></i>
                        新建画布
                    </button>
                </div>
            </header>

            <section id="board" class="hh-project-board" aria-live="polite">
                <div id="boardWorld" class="hh-project-grid"></div>
                <div id="boardEmptyHint" class="hh-project-empty" hidden>
                    <i data-lucide="layers"></i>
                    <strong>暂无画布</strong>
                    <span>为当前项目创建第一块智能画布</span>
                    <button id="emptyCreateCanvasBtn" type="button">新建画布</button>
                </div>
            </section>

            <section id="trashPanel" class="hh-trash-panel" hidden>
                <div class="hh-trash-head">
                    <div>
                        <i data-lucide="trash-2"></i>
                        <strong>回收站</strong>
                    </div>
                    <button id="trashClose" type="button" title="关闭"><i data-lucide="x"></i></button>
                </div>
                <p>回收站中的画布会在 30 天后自动清理。</p>
                <div id="trashList" class="hh-trash-list"></div>
            </section>
            <div id="boardStatus" class="hh-status-toast" role="status"></div>
        </main>
    </div>

    <dialog id="canvasNameDialog" class="hh-dialog">
        <form method="dialog" id="canvasNameForm">
            <h2 id="canvasDialogTitle">新建画布</h2>
            <label>
                画布名称
                <input id="canvasNameInput" maxlength="80" autocomplete="off" placeholder="未命名画布">
            </label>
            <div>
                <button value="cancel" class="hh-dialog-secondary">取消</button>
                <button id="canvasDialogConfirm" value="default" class="hh-dialog-primary">确认</button>
            </div>
        </form>
    </dialog>
    <script src="/static/js/huahai-interactions.js"></script>
    <script src="/static/js/canvas-list.js"></script>
</body>
</html>
